services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notevault
      POSTGRES_USER: notevault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [data]          # not published to the host: TB3
  app:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://notevault:${DB_PASSWORD}@db:5432/notevault
      NOTEVAULT_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
    depends_on: [db]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [data, web]
  proxy:                       # only published service: TLS + HSTS (TB1/TB2)
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
    depends_on: [app]
    networks: [web]
networks:
  data: { internal: true }
  web: {}
volumes: { dbdata: {}, caddy: {} }
